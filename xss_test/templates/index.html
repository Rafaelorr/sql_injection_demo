<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/static/styles.css">
  <title>Mijn Blog</title>
</head>
<body>
  <main>
    <header>
      <h1>Mijn Blog</h1>
    </header>

    <section class="blog-post">
      <p>Dit is een eenvoudige blog post. Als je wilt kun je een comment achterlaten!</p>
    </section>

    <section class="comment-form">
      <h2>Laat een reactie achter</h2>
      <form action="/add_comment" method="POST">
        <div>
          <label for="comment">Je comment:</label><br />
          <textarea id="comment" name="comment" rows="4" cols="50" required></textarea>
        </div>
        <div>
          <button type="submit">Plaats reactie</button>
        </div>
      </form>
    </section>

    <section class="comments">
      <h3>Alle reacties</h3>
      {% for comment in comments %}
      <article class="comment">
        <p>{{ comment | safe }}</p>
      </article>
      {% endfor %}
    </section>
  </main>
</body>
</html>
